<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Home Display</title>
<style>
:root{
  --bg:#0b1119;--panel:rgba(255,255,255,.055);--panel2:rgba(255,255,255,.082);
  --line:rgba(255,255,255,.095);--text:#f5f7fb;--muted:#aeb9c8;
  --accent:#a8d9ff;--good:#b9ebcb;--emby:#52b54b;--date-blue:#5795f7;--radius:30px;--shadow:0 24px 70px rgba(0,0,0,.28);--top-info-size:clamp(94px,7.45vw,136px)
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text)}
body{
  font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-variant-numeric:tabular-nums;
  background:
    radial-gradient(circle at 16% 12%,rgba(64,122,170,.15),transparent 34%),
    radial-gradient(circle at 84% 78%,rgba(84,130,113,.09),transparent 34%),
    linear-gradient(145deg,#090e15,#101722 58%,#0a1017)
}
body::before{
  content:"";position:fixed;inset:-15%;pointer-events:none;opacity:.28;
  background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.025),transparent 52%);
  animation:ambient 80s ease-in-out infinite alternate
}
@keyframes ambient{
  from{transform:translate3d(-2%,-1%,0) scale(1)}
  to{transform:translate3d(2%,1.5%,0) scale(1.06)}
}

#screen{
  position:absolute;inset:10px;padding:clamp(10px,.9vw,16px);
  display:grid;
  grid-template-rows:minmax(182px,.51fr) minmax(370px,1.15fr) minmax(245px,.72fr);
  gap:clamp(10px,1vw,16px);
  transition:transform 4s ease-in-out,filter 2s ease;
  will-change:transform
}
.card{
  border:1px solid var(--line);border-radius:var(--radius);
  background:linear-gradient(180deg,var(--panel2),var(--panel));
  box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)
}

/* TOP */
.top{display:grid;grid-template-columns:1fr 1fr 1fr;min-height:0;overflow:hidden}
.top-section{
  min-width:0;display:flex;align-items:center;justify-content:center;
  padding:clamp(4px,.6vw,10px)
}
.top-section + .top-section{border-left:1px solid var(--line)}
.clock{
  width:100%;text-align:center;white-space:nowrap;
  font-size:var(--top-info-size);line-height:.88;font-weight:bold;letter-spacing:-.055em
}
.date{
  width:100%;text-align:center;white-space:nowrap;
  font-size:var(--top-info-size);line-height:.88;font-weight:bold;letter-spacing:-.05em;color:var(--date-blue)
}
#dateLine1,#dateLine2{display:inline}
#dateLine1 + #dateLine2::before{content:" "}
.weather-now{
  width:100%;display:flex;align-items:center;justify-content:center;gap:clamp(2px,.55vw,10px)
}
.weather-icon{
  width:clamp(182px,11.6vw,232px);height:clamp(182px,11.6vw,232px);
  object-fit:contain;filter:drop-shadow(0 14px 22px rgba(0,0,0,.22))
}
.temperature{
  font-size:var(--top-info-size);line-height:.88;font-weight:bold;letter-spacing:-.055em;white-space:nowrap
}

/* FORECAST */
.forecast{
  display:grid;grid-template-columns:repeat(5,1fr);min-height:0;padding:clamp(6px,.6vw,10px);color:var(--date-blue)
}
.day{
  min-width:0;min-height:0;text-align:center;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(2px,.3vh,5px);
  padding:clamp(7px,.7vw,12px) clamp(5px,.6vw,10px)
}
.day + .day{border-left:1px solid var(--line)}
.day-name{
  font-size:clamp(65px,6vw,75px);font-weight:760;line-height:.95;letter-spacing:.015em;color:var(--date-blue)
}
.day img{
  width:clamp(182px,11.6vw,232px);height:clamp(182px,11.6vw,232px);
  object-fit:contain;filter:drop-shadow(0 14px 24px rgba(0,0,0,.18))
}
.forecast-temp{
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:.95
}
.forecast-high{
  font-size:clamp(65px,6vw,75px);font-weight:720;letter-spacing:-.035em
}
.forecast-low{
  margin-top:0;font-size:clamp(65px,6vw,75px);font-weight:560;color:var(--date-blue);letter-spacing:-.025em
}

/* EMBY */
.emby{
  min-height:0;overflow:hidden;padding:clamp(8px,.8vw,13px);
  display:flex;flex-direction:column
}
.eyebrow{
  font-size:clamp(11px,.72vw,14px);font-weight:760;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)
}
.player-main{
  flex:1;min-height:0;margin-top:3px;
  display:grid;grid-template-columns:auto minmax(0,1fr);
  gap:clamp(14px,1.1vw,20px);align-items:center
}
.cover-wrap{
  height:min(21vh,225px);aspect-ratio:2/3;border-radius:13px;overflow:hidden;
  background:rgba(255,255,255,.04);border:1px solid var(--line);box-shadow:0 12px 30px rgba(0,0,0,.28)
}
#cover{width:100%;height:100%;object-fit:cover;display:block}
.player-copy{min-width:0;display:flex;flex-direction:column;justify-content:center}
.playing-state{
  display:inline-flex;align-items:center;gap:7px;color:var(--good);
  font-size:clamp(12px,.8vw,16px);font-weight:700
}
.playing-state::before{
  content:"";width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 12px currentColor
}
.media-title{
  margin-top:5px;font-size:clamp(38px,2.9vw,56px);line-height:1;font-weight:720;letter-spacing:-.04em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.media-subtitle{
  margin-top:3px;color:var(--muted);font-size:clamp(18px,1.25vw,24px);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.timeline{margin-top:clamp(8px,1vh,13px);width:100%}
.track{height:12px;background:rgba(255,255,255,.11);border-radius:999px;overflow:hidden}
.fill{width:0;height:100%;background:var(--emby);box-shadow:0 0 16px rgba(82,181,75,.22);border-radius:999px;transition:width .8s linear}
.time-labels{display:flex;justify-content:space-between;margin-top:5px;color:var(--text);font-size:clamp(14px,.9vw,18px);font-weight:550}
.idle{
  height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;
  padding:10px;color:var(--muted)
}
.idle-mark{font-size:36px;line-height:1;opacity:.5}
.idle-title{margin-top:2px;color:var(--text);font-size:clamp(20px,1.3vw,26px);font-weight:650}
.idle-copy{margin-top:2px;font-size:clamp(12px,.8vw,15px)}
#status{position:fixed;right:12px;bottom:3px;font-size:9px;color:rgba(255,255,255,.15);z-index:10;pointer-events:none}
body.night #screen{filter:brightness(.62) saturate(.86)}


/* SURFACE PRO / 3:2 DISPLAY
   Keep the widescreen layout unchanged, while tuning the Surface's 3:2 screen. */
@media (max-aspect-ratio: 8/5){
  #screen{
    grid-template-rows:minmax(255px,.78fr) minmax(355px,1.08fr) minmax(165px,.50fr);
  }

  :root{
    --top-info-size:clamp(120px,10.8vw,158px);
  }

  .top-section{
    padding:clamp(6px,.7vw,12px);
  }

  .clock{
    font-size:clamp(132px,11.7vw,170px);
    line-height:.9;
  }

  .date{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    white-space:normal;
    font-size:clamp(94px,8.1vw,118px);
    line-height:.88;
  }

  #dateLine1,#dateLine2{
    display:block;
  }

  #dateLine1 + #dateLine2::before{
    content:"";
  }

  .weather-now{
    gap:clamp(4px,.5vw,8px);
  }

  .weather-icon{
    width:clamp(135px,10.2vw,165px);
    height:clamp(135px,10.2vw,165px);
  }

  .temperature{
    font-size:clamp(132px,11.7vw,170px);
    line-height:.9;
  }

  .forecast{
    padding:clamp(8px,.7vw,12px);
  }

  .day{
    justify-content:center;
    gap:clamp(3px,.35vh,6px);
    padding:clamp(8px,.7vw,12px) clamp(5px,.6vw,10px);
  }

  .day-name{
    font-size:clamp(65px,6vw,75px);
    line-height:1;
  }

  .day img{
    width:clamp(135px,10.2vw,165px);
    height:clamp(135px,10.2vw,165px);
  }

  .forecast-high{
    font-size:clamp(65px,6vw,75px);
    line-height:1;
  }

  .forecast-low{
    font-size:clamp(65px,6vw,75px);
    line-height:1;
  }

  .cover-wrap{
    height:min(16vh,170px);
  }
}
</style>
</head>

<body>
<div id="screen">

  <section class="card top">
    <div class="top-section">
      <div id="clock" class="clock">--:--</div>
    </div>

    <div class="top-section">
      <div id="date" class="date"><span id="dateLine1">Loading…</span><span id="dateLine2"></span></div>
    </div>

    <div class="top-section">
      <div class="weather-now">
        <img id="weatherIcon" class="weather-icon" alt="Current weather">
        <div id="temperature" class="temperature">--°</div>
      </div>
    </div>
  </section>

  <section id="forecast" class="card forecast"></section>

  <section class="card emby">
    <div class="eyebrow">Emby · Now playing</div>

    <div id="playerContent" class="player-main" hidden>
      <div class="cover-wrap">
        <img id="cover" alt="Now playing artwork">
      </div>

      <div class="player-copy">
        <div id="playingState" class="playing-state">Playing</div>
        <div id="mediaTitle" class="media-title">Nothing playing</div>
        <div id="mediaSubtitle" class="media-subtitle"></div>

        <div class="timeline">
          <div class="track">
            <div id="timelineFill" class="fill"></div>
          </div>
          <div class="time-labels">
            <span id="elapsed">0:00</span>
            <span id="duration">0:00</span>
          </div>
        </div>
      </div>
    </div>

    <div id="playerIdle" class="idle">
      <div class="idle-title">Nothing playing</div>
    </div>
  </section>

</div>

<div id="status"></div>

<script>
const CONFIG = {
  openWeatherApiKey:"2a8ea8b30d67c045b8023ac12220d885",
  latitude:"51.8892",
  longitude:"0.9042",

  embyServer:"http://192.168.0.19:8096",
  embyApiKey:"ebfff6e85e6f42f2be3011a029f4e602",
  embyPlayerName:"",

  weatherRefreshMinutes:15,
  embyRefreshSeconds:5,

  pixelShift:true,
  pixelShiftPixels:7,
  pixelShiftSeconds:75,

  nightDim:{enabled:true,startHour:0,endHour:6}
};

const TICKS_PER_SECOND=10000000;
let currentPlayback=null;
let lastWeatherOkay=false;
let lastEmbyOkay=false;

function setStatus(){
  document.getElementById("status").textContent=
    `${lastWeatherOkay?"weather ✓":"weather –"}   ${lastEmbyOkay?"emby ✓":"emby –"}`;
}

function updateClock(){
  const now=new Date();

  document.getElementById("clock").textContent=
    new Intl.DateTimeFormat(undefined,{
      hour:"2-digit",minute:"2-digit",hour12:false
    }).format(now);

  const weekday=new Intl.DateTimeFormat(undefined,{weekday:"short"}).format(now).toUpperCase();
 const months = [
  "JAN", "FEB", "MAR", "APR", "MAY", "JUN",
  "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"
];

const day = now.getDate();
  const month = months[now.getMonth()];
  document.getElementById("dateLine1").textContent=`${weekday} ${day}`;
  document.getElementById("dateLine2").textContent=month;

  const d=CONFIG.nightDim;
  if(d.enabled){
    const h=now.getHours();
    const inRange=d.startHour<d.endHour
      ? h>=d.startHour && h<d.endHour
      : h>=d.startHour || h<d.endHour;
    document.body.classList.toggle("night",inRange);
  }
}

function owmIcon(code){
  return `https://openweathermap.org/img/wn/${code}@4x.png`;
}

function localDayKey(date){
  return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,"0")}-${String(date.getDate()).padStart(2,"0")}`;
}

async function fetchWeather(){
  const key=CONFIG.openWeatherApiKey.trim();
  const lat=CONFIG.latitude.trim();
  const lon=CONFIG.longitude.trim();

  if(!key || key.includes("PASTE_") || !lat || lat.includes("PASTE_") || !lon || lon.includes("PASTE_")){
    renderWeatherDemo();
    lastWeatherOkay=false;
    setStatus();
    return;
  }

  try{
    const currentUrl=`https://api.openweathermap.org/data/2.5/weather?lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lon)}&appid=${encodeURIComponent(key)}&units=metric`;
    const forecastUrl=`https://api.openweathermap.org/data/2.5/forecast?lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lon)}&appid=${encodeURIComponent(key)}&units=metric`;

    const [currentRes,forecastRes]=await Promise.all([
      fetch(currentUrl),
      fetch(forecastUrl)
    ]);

    if(!currentRes.ok || !forecastRes.ok){
      throw new Error(`Weather HTTP ${currentRes.status}/${forecastRes.status}`);
    }

    const current=await currentRes.json();
    const forecast=await forecastRes.json();

    renderCurrentWeather(current);
    renderForecast(forecast.list);
    lastWeatherOkay=true;
  }catch(err){
    console.error("Weather error",err);
    lastWeatherOkay=false;
  }

  setStatus();
}

function renderCurrentWeather(d){
  const w=d.weather?.[0]||{};
  document.getElementById("weatherIcon").src=owmIcon(w.icon||"01d");
  document.getElementById("temperature").textContent=`${Math.round(d.main.temp)}°`;
}

function renderForecast(list){
  const days=new Map();

  for(const x of list){
    const date=new Date(x.dt*1000);
    const key=localDayKey(date);
    if(!days.has(key)) days.set(key,[]);
    days.get(key).push(x);
  }

  const chosen=[...days.entries()]
    .slice(0,5);

  const host=document.getElementById("forecast");
  host.innerHTML="";

  for(const [,entries] of chosen){
    const midday=entries.reduce((best,x)=>{
      const h=new Date(x.dt*1000).getHours();
      const bh=new Date(best.dt*1000).getHours();
      return Math.abs(h-12)<Math.abs(bh-12)?x:best;
    },entries[0]);

    const low=Math.round(Math.min(...entries.map(x=>x.main.temp_min)));
    const high=Math.round(Math.max(...entries.map(x=>x.main.temp_max)));
    const date=new Date(midday.dt*1000);
    const dayName=new Intl.DateTimeFormat(undefined,{weekday:"short"}).format(date).toUpperCase();
    const icon=midday.weather?.[0]?.icon||"01d";

    const div=document.createElement("div");
    div.className="day";
    div.innerHTML=`
      <div class="day-name">${dayName}</div>
      <img src="${owmIcon(icon)}" alt="">
      <div class="forecast-temp">
        <span class="forecast-high">${high}°</span>
        <span class="forecast-low">${low}°</span>
      </div>
    `;
    host.appendChild(div);
  }
}

function renderWeatherDemo(){
  document.getElementById("weatherIcon").src=owmIcon("02d");
  document.getElementById("temperature").textContent="18°";

  const demo=[
    ["WED","03d",18,11],
    ["THU","01d",21,12],
    ["FRI","04d",20,13],
    ["SAT","10d",18,11],
    ["SUN","02d",19,12]
  ];

  const host=document.getElementById("forecast");
  host.innerHTML="";

  for(const [name,icon,high,low] of demo){
    const div=document.createElement("div");
    div.className="day";
    div.innerHTML=`
      <div class="day-name">${name}</div>
      <img src="${owmIcon(icon)}" alt="">
      <div class="forecast-temp">
        <span class="forecast-high">${high}°</span>
        <span class="forecast-low">${low}°</span>
      </div>
    `;
    host.appendChild(div);
  }
}

async function fetchEmby(){
  const server=CONFIG.embyServer.replace(/\/$/,"");
  const key=CONFIG.embyApiKey.trim();

  if(!server || server.includes("YOUR-EMBY-SERVER") || !key || key.includes("PASTE_")){
    renderEmbyDemo();
    lastEmbyOkay=false;
    setStatus();
    return;
  }

  try{
    const res=await fetch(`${server}/Sessions?api_key=${encodeURIComponent(key)}`);
    if(!res.ok) throw new Error(`Emby HTTP ${res.status}`);

    const sessions=await res.json();
    let candidates=sessions.filter(s=>s.NowPlayingItem);

    if(CONFIG.embyPlayerName.trim()){
      const q=CONFIG.embyPlayerName.trim().toLowerCase();
      const filtered=candidates.filter(s=>
        `${s.DeviceName||""} ${s.Client||""}`.toLowerCase().includes(q)
      );
      if(filtered.length) candidates=filtered;
    }

    const session=candidates.find(s=>!s.PlayState?.IsPaused)||candidates[0];

    if(!session){
      currentPlayback=null;
      showEmbyIdle();
      lastEmbyOkay=true;
      setStatus();
      return;
    }

    renderEmbySession(session,server,key);
    lastEmbyOkay=true;
  }catch(err){
    console.error("Emby error",err);
    lastEmbyOkay=false;
  }

  setStatus();
}

function renderEmbySession(session,server,key){
  const item=session.NowPlayingItem;
  const ps=session.PlayState||{};
  const runtime=item.RunTimeTicks||0;
  const position=ps.PositionTicks||0;

  currentPlayback={
    positionTicks:position,
    runtimeTicks:runtime,
    paused:!!ps.IsPaused,
    syncedAt:Date.now()
  };

  document.getElementById("playerIdle").hidden=true;
  document.getElementById("playerContent").hidden=false;
  document.getElementById("playingState").textContent=ps.IsPaused?"Paused":"Playing";
  let displayTitle=item.Name||"Unknown title";

  let subtitle="";

  if(item.Type==="Episode"){
    if(item.SeriesName){
      displayTitle=`${item.SeriesName} — ${item.Name||"Unknown episode"}`;
    }

    if(item.ParentIndexNumber!=null && item.IndexNumber!=null){
      subtitle=`S${item.ParentIndexNumber} · E${item.IndexNumber}`;
    }
  }else if(item.Type==="Audio"){
    subtitle=(item.Artists||[]).join(", ")||item.Album||"";
  }else{
    subtitle=item.ProductionYear?String(item.ProductionYear):"";
  }

  document.getElementById("mediaTitle").textContent=displayTitle;
  document.getElementById("mediaSubtitle").textContent=subtitle;

  /*
    For TV episodes use the parent series poster rather than the
    episode-specific primary image. Movies/audio fall back to their
    normal primary artwork.
  */
  const imageItemId=
    item.Type==="Episode" && item.SeriesId
      ? item.SeriesId
      : (item.PrimaryImageItemId||item.Id);

  let imageUrl=`${server}/Items/${encodeURIComponent(imageItemId)}/Images/Primary?maxHeight=1200&quality=92&api_key=${encodeURIComponent(key)}`;

  document.getElementById("cover").src=imageUrl;
  updateTimeline();
}

function showEmbyIdle(){
  document.getElementById("playerContent").hidden=true;
  document.getElementById("playerIdle").hidden=false;
}

function renderEmbyDemo(){
  document.getElementById("playerIdle").hidden=true;
  document.getElementById("playerContent").hidden=false;
  document.getElementById("playingState").textContent="Demo";
  document.getElementById("mediaTitle").textContent="Your Emby title appears here";
  document.getElementById("mediaSubtitle").textContent="Series / film details";

  document.getElementById("cover").src=
    "data:image/svg+xml;charset=UTF-8,"+
    encodeURIComponent(`
      <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 900'>
        <defs>
          <linearGradient id='g' x1='0' y1='0' x2='1' y2='1'>
            <stop stop-color='#273649'/>
            <stop offset='1' stop-color='#101720'/>
          </linearGradient>
        </defs>
        <rect width='600' height='900' fill='url(#g)'/>
        <circle cx='300' cy='390' r='105' fill='none' stroke='#9fd6ff' stroke-opacity='.42' stroke-width='18'/>
        <path d='M275 330l115 60-115 60z' fill='#dcecff' fill-opacity='.8'/>
        <text x='300' y='640' text-anchor='middle' fill='#dcecff' font-family='sans-serif' font-size='42'>EMBY</text>
      </svg>
    `);

  currentPlayback={
    positionTicks:23*60*TICKS_PER_SECOND,
    runtimeTicks:52*60*TICKS_PER_SECOND,
    paused:true,
    syncedAt:Date.now()
  };

  updateTimeline();
}

function formatDuration(sec){
  sec=Math.max(0,Math.floor(sec));
  const h=Math.floor(sec/3600);
  sec%=3600;
  const m=Math.floor(sec/60);
  const s=sec%60;

  return h
    ? `${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`
    : `${m}:${String(s).padStart(2,"0")}`;
}

function updateTimeline(){
  if(!currentPlayback) return;

  let pos=currentPlayback.positionTicks/TICKS_PER_SECOND;
  const dur=currentPlayback.runtimeTicks/TICKS_PER_SECOND;

  if(!currentPlayback.paused){
    pos+=(Date.now()-currentPlayback.syncedAt)/1000;
  }

  pos=Math.min(pos,dur||pos);

  const pct=dur
    ? Math.max(0,Math.min(100,pos/dur*100))
    : 0;

  document.getElementById("timelineFill").style.width=`${pct}%`;
  document.getElementById("elapsed").textContent=formatDuration(pos);
  document.getElementById("duration").textContent=formatDuration(dur);
}

function shiftPixels(){
  if(!CONFIG.pixelShift) return;

  const p=CONFIG.pixelShiftPixels;
  const x=Math.round((Math.random()*2-1)*p);
  const y=Math.round((Math.random()*2-1)*p);

  document.getElementById("screen").style.transform=`translate(${x}px,${y}px)`;
}

updateClock();
setInterval(updateClock,1000);

setInterval(updateTimeline,1000);

fetchWeather();
setInterval(fetchWeather,CONFIG.weatherRefreshMinutes*60*1000);

fetchEmby();
setInterval(fetchEmby,CONFIG.embyRefreshSeconds*1000);

shiftPixels();
setInterval(shiftPixels,CONFIG.pixelShiftSeconds*1000);
</script>
</body>
</html>
